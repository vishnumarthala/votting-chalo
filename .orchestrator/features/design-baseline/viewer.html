<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Plan Viewer</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e3e2dc;--accent:#2b59c3;
--pass:#1f8a4c;--fail:#c2362b;--stale:#b7791f;--pending:#8a8a84;--skip:#5f6b7a;--chip:#efeee9}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--muted:#a3a29c;--line:#33332f;
--accent:#7aa2ff;--pass:#4cc38a;--fail:#ff6b5e;--stale:#e3b341;--pending:#8f8e88;--skip:#9aa7b8;--chip:#2a2a27}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:0 auto}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}
nav{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 8px;font:inherit;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--accent)}main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.id{font:600 13px ui-monospace,monospace;color:var(--accent)}
.title{font-weight:600}.muted{color:var(--muted);font-size:13px}.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0}
.st-pass,.st-done{color:var(--pass)}.st-fail,.st-invalid{color:var(--fail)}.st-stale,.st-active{color:var(--stale)}.st-pending,.st-todo,.st-unapproved{color:var(--pending)}.st-skipped{color:var(--skip)}
.gate{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:3px 4px 0 0;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
ul{margin:6px 0 0;padding-left:20px}li{margin:2px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat{font-size:26px;font-weight:700}.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--accent)}
.err{color:var(--fail)}.warn{color:var(--stale)}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}.spec{white-space:pre-wrap;font:13px/1.55 ui-monospace,monospace}
.banner{border-left:4px solid var(--stale);padding:10px 14px;background:var(--panel);margin-bottom:12px;border-radius:6px}
.tbl{overflow-x:auto}
</style>
</head>
<body>
<header><h1 id="h"></h1><div class="sub" id="sub"></div></header>
<nav id="tabs"></nav>
<main id="main"></main>
<script>
const DATA = {"project": "votting-chalo", "feature": "design-baseline", "title": "Clear pre-existing design_check findings in index.html", "phase": "plan", "mode": "plan_and_end", "tier": "quick", "approved": {"at": "2026-10-18T14:16:32+00:00", "hash": "ab87edf4065b5cb24b5ce73ab656d103167889fc352a0d9f0c12a3d13907b7c7", "cases": 1, "mode": "verified", "quote": "yes, go ahead"}, "spec": "", "checkpoints": [{"id": "CP-1", "title": "Clear design_check baseline in index.html", "type": "logic", "goal": "design_check passes on the existing UI so later UI checkpoints are judged only on their own changes", "done_when": ["npx --yes impeccable@4 detect --quiet client index.html exits 0 with no ignores; npm test passes"], "gates": [], "state": "todo", "stage": null, "commit": null, "gate_rows": [{"id": "red", "title": "Red (tests first)", "status": "pending", "attempts": 0}, {"id": "behavior", "title": "Behavior", "status": "pending", "attempts": 0}, {"id": "review", "title": "Two-axis review", "status": "pass", "attempts": 0}, {"id": "judge", "title": "Main-model judge", "status": "pending", "attempts": 0}]}], "cases": [{"id": "T-1", "cp": "CP-1", "category": "regression", "level": "unit", "seam": "index.html <style> (.disc, kbd, .card:before rules)", "title": "Clear design_check baseline in index.html", "given": "index.html's stylesheet", "when": "the .disc disclaimer rule is read", "then": "its font-size is >=12px and its color has >=4.5:1 contrast against --paper"}], "decisions": [{"id": "D-1", "feature": "design-baseline", "dimension": "problem", "question": "What should change?", "options": [], "chosen": "Clear the 14 pre-existing design_check findings in index.html: remove the .card:before stripe; restyle kbd's 2px bottom border as an inset box-shadow; make the .disc disclaimer 12px in #75624e (5.03:1 on #f6eedd)", "rationale": "design_check exits 2 on main, so every UI checkpoint's design gate fails. impeccable can only waive these rules file-wide ('*'), which would also hide future real findings, so fix rather than waive. User chose remove-stripe and restyle-keycap.", "status": "decided", "blocking": false, "affects": [], "remind_at": [], "created_at": "2026-10-18T14:14:34.272728+00:00", "resolved_at": "2026-10-18T14:14:34.272760+00:00"}, {"id": "D-2", "feature": "design-baseline", "dimension": "acceptance", "question": "How do we know it is done?", "options": [], "chosen": "npx --yes impeccable@4 detect --quiet client index.html exits 0 with no ignores config and no inline waivers; npm test passes, including a test that the disclaimer is >=12px and >=4.5:1 contrast against --paper", "rationale": "The detector is the gate's own check; the unit test guards the one real accessibility defect in the offline test suite.", "status": "decided", "blocking": false, "affects": [], "remind_at": [], "created_at": "2026-10-18T14:14:34.332241+00:00", "resolved_at": "2026-10-18T14:14:34.332265+00:00"}], "grill": {"coverage": {"problem": ["decided", "D-1"], "acceptance": ["decided", "D-2"]}, "confirmed": null}, "validation": {"errors": [], "warnings": [], "stats": {"tier": "quick", "checkpoints": 1, "cases": 1, "min_cases": 1, "seams": ["index.html <style> (.disc, kbd, .card:before rules)"], "categories": {"regression": 1}, "required_categories": {}, "acceptance_criteria": [], "uncovered_criteria": []}}, "awaiting_user": null, "escalated": null};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const st = s => `<span class="st-${esc(s)}"><span class="dot"></span> ${esc(s)}</span>`;
const TABS = ["Overview","Checkpoints","Tests","Decisions","Spec"];
let tab = "Overview";
try { tab = localStorage.getItem("forge-tab") || tab; } catch(e) {}

function overview(d){
  const v = d.validation, s = v.stats, done = d.checkpoints.filter(c=>c.state==="done").length;
  let h = "";
  if (d.escalated) h += `<div class="banner"><b>Escalated:</b> ${esc(d.escalated.reason)}</div>`;
  else if (d.awaiting_user) h += `<div class="banner"><b>Waiting for you:</b> ${esc(d.awaiting_user.reason)}</div>`;
  h += `<div class="grid">
    <div class="card"><div class="muted">Checkpoints done</div><div class="stat">${done} / ${d.checkpoints.length}</div></div>
    <div class="card"><div class="muted">Test cases</div><div class="stat">${s.cases}</div><div class="muted">minimum ${s.min_cases}</div></div>
    <div class="card"><div class="muted">Plan</div><div class="stat ${v.errors.length?"st-fail":"st-pass"}">${v.errors.length?"invalid":"valid"}</div>
      <div class="muted">${d.approved?"approved "+esc(d.approved.at):"not approved yet"}</div></div>
    <div class="card"><div class="muted">Tier</div><div class="stat">${esc(d.tier)}</div><div class="muted">grill ${d.grill.confirmed?"confirmed":"not confirmed"}</div></div></div>`;
  if (v.errors.length || v.warnings.length) h += `<div class="card"><b>Plan checks</b><ul>${v.errors.map(e=>`<li class="err">${esc(e)}</li>`).join("")}${v.warnings.map(w=>`<li class="warn">${esc(w)}</li>`).join("")}</ul></div>`;
  const req = s.required_categories || {}, have = s.categories || {};
  h += `<div class="card"><b>Test category coverage</b><div class="tbl"><table><tr><th>Category</th><th>Required</th><th>Planned</th></tr>${
    Object.keys({...req,...have}).sort().map(k=>`<tr><td>${esc(k)}</td><td>${req[k]??"–"}</td><td class="${(have[k]||0)>=(req[k]||0)?"st-pass":"st-fail"}">${have[k]||0}</td></tr>`).join("")}</table></div></div>`;
  const cov = Object.entries(d.grill.coverage||{});
  if (cov.length) h += `<div class="card"><b>Grill coverage</b><div class="tbl"><table><tr><th>Dimension</th><th>Status</th><th>Detail</th></tr>${
    cov.map(([k,[stt,info]])=>`<tr><td>${esc(k)}</td><td class="${stt==="open"||stt==="blocking"?"st-fail":"st-pass"}">${esc(stt)}</td><td class="muted">${esc(info)}</td></tr>`).join("")}</table></div></div>`;
  if ((s.seams||[]).length) h += `<div class="card"><b>Agreed test seams</b><ul>${s.seams.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  return h;
}
function checkpoints(d){
  return d.checkpoints.map(c=>`<div class="card"><div class="row"><span class="id">${esc(c.id)}</span><span class="title">${esc(c.title)}</span>
    <span class="chip">${esc(c.type)}</span>${st(c.state)}${c.commit?`<span class="muted">commit ${esc(c.commit.slice(0,8))}</span>`:""}</div>
    <div style="margin-top:6px">${esc(c.goal)}</div>
    <div class="muted" style="margin-top:6px">Done when:</div><ul>${(c.done_when||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <div style="margin-top:8px">${(c.gate_rows||[]).map(g=>`<span class="gate st-${esc(g.status)}" title="${esc(g.title)}"><span class="dot"></span>${esc(g.id)}${g.attempts?` ·${g.attempts}✗`:""}</span>`).join("")}</div>
    ${(c.decision_refs||[]).length?`<div class="muted" style="margin-top:6px">Decisions: ${c.decision_refs.map(esc).join(", ")}</div>`:""}
    ${c.red_exempt?`<div class="muted">Red exempt: ${esc(c.red_exempt)}</div>`:""}</div>`).join("") || `<div class="card muted">No checkpoints yet.</div>`;
}
function tests(d){
  const by = {}; d.cases.forEach(t=>(by[t.cp] ||= []).push(t));
  return Object.keys(by).sort((a,b)=>+a.split("-")[1]-+b.split("-")[1]).map(cp=>`<div class="card"><b class="id">${esc(cp)}</b><div class="tbl"><table>
    <tr><th>ID</th><th>Category</th><th>Case</th><th>Given / When / Then</th><th>AC</th></tr>${by[cp].map(t=>`<tr><td class="id">${esc(t.id)}</td>
    <td><span class="chip">${esc(t.category)}</span><div class="muted">${esc(t.level||"")}</div></td><td>${esc(t.title)}</td>
    <td><div><b>Given</b> ${esc(t.given)}</div><div><b>When</b> ${esc(t.when)}</div><div><b>Then</b> ${esc(t.then)}</div></td>
    <td>${esc([].concat(t.criterion||t.criteria||[]).join(", "))}</td></tr>`).join("")}</table></div></div>`).join("") || `<div class="card muted">No test plan yet.</div>`;
}
function decisions(d){
  return d.decisions.map(x=>`<div class="card"><div class="row"><span class="id">${esc(x.id)}</span><span class="chip">${esc(x.dimension||"-")}</span>
    ${st(x.status==="decided"?"pass":x.status==="assumed"?"stale":"fail")}<span class="muted">${esc(x.status)}${x.blocking?" · blocking":""}</span></div>
    <div class="title" style="margin-top:4px">${esc(x.question)}</div>${x.chosen?`<div>→ ${esc(x.chosen)}</div>`:""}
    ${x.rationale?`<div class="muted">${esc(x.rationale)}</div>`:""}
    ${(x.options||[]).length?`<ul>${x.options.map(o=>`<li><b>${esc(o.label)}</b> — ${esc(o.description||"")}</li>`).join("")}</ul>`:""}</div>`).join("") || `<div class="card muted">No decisions recorded.</div>`;
}
function spec(d){ return `<div class="card spec">${esc(d.spec || "spec.md not written yet")}</div>`; }
const R = {Overview:overview, Checkpoints:checkpoints, Tests:tests, Decisions:decisions, Spec:spec};
function draw(){
  document.getElementById("tabs").innerHTML = TABS.map(t=>`<button class="${t===tab?"on":""}" data-t="${t}">${t}</button>`).join("");
  document.getElementById("main").innerHTML = R[tab](DATA);
}
if (!DATA) { document.getElementById("main").textContent = "No data embedded. Run `forge plan render`."; }
else {
  document.getElementById("h").textContent = `${DATA.title} — ${DATA.project}`;
  document.getElementById("sub").textContent = `feature ${DATA.feature} · tier ${DATA.tier} · phase ${DATA.phase} · mode ${DATA.mode}`;
  document.getElementById("tabs").addEventListener("click", e => { const t = e.target.dataset.t; if (!t) return;
    tab = t; try { localStorage.setItem("forge-tab", t); } catch(e) {} draw(); });
  if (!R[tab]) tab = "Overview";
  draw();
}
</script>
</body>
</html>
